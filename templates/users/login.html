
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión - DentalSecureLab</title>

    <link rel="stylesheet"
          href="{% static 'css/styles.css' %}">

    <style>
        .login-container {
            max-width: 400px;
            margin: 80px auto;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background-color: #fff;
        }

        .login-container h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-field {
            margin-bottom: 18px;
        }

        .login-field label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .login-field input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .login-button {
            width: 100%;
            padding: 12px;
            background-color: #175a91;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .login-error {
            color: #a00000;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>
    <div class="login-container">

        <h1>DentalSecureLab</h1>
        <h2>Iniciar sesión</h2>

        {% if error %}
            <p class="login-error" role="alert">
                {{ error }}
            </p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <input type="hidden"
                   name="next"
                   value="{{ next|default:'' }}">

            <div class="login-field">
                <label for="id_username">
                    Usuario:
                </label>

                <input type="text"
                       name="username"
                       id="id_username"
                       autocomplete="username"
                       required>
            </div>

            <div class="login-field">
                <label for="id_password">
                    Contraseña:
                </label>

                <input type="password"
                       name="password"
                       id="id_password"
                       autocomplete="current-password"
                       required>
            </div>

            <button type="submit"
                    class="login-button">
                Entrar
            </button>
        </form>

    </div>
</body>
</html>
