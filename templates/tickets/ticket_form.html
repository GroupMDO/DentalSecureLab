
{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Registrar nuevo ticket TI</h2>

    <div class="card mt-4">
        <div class="card-body">

            <form method="post">
                {% csrf_token %}

                {% if form.non_field_errors %}
                    <div class="alert alert-danger">
                        {{ form.non_field_errors }}
                    </div>
                {% endif %}

                {% for field in form %}
                    <div class="mb-3">
                        <label for="{{ field.id_for_label }}"
                               class="form-label">
                            {{ field.label }}
                        </label>

                        <div>
                            {{ field }}
                        </div>

                        {% if field.errors %}
                            <div class="text-danger">
                                {{ field.errors }}
                            </div>
                        {% endif %}
                    </div>
                {% endfor %}

                <button type="submit"
                        class="btn btn-primary">
                    Registrar ticket
                </button>

                <a href="{% url 'tickets:ticket_list' %}"
                   class="btn btn-secondary">
                    Cancelar
                </a>
            </form>

        </div>
    </div>
</div>
{% endblock %}
